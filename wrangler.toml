# Cloudflare Worker config for the self-hosted Fire relay.
#
# Deploy:
#   npm install
#   npx wrangler login
#   npx wrangler secret put RELAY_SECRET      # paste a long random string
#   npm run deploy
#
# Then in the Fire app's phone settings, set:
#   Relay URL    = https://fire-relay.<your-subdomain>.workers.dev
#   Relay secret = the RELAY_SECRET you set above

name = "fire-relay"
main = "src/worker.mjs"
compatibility_date = "2024-11-01"

# Optional overrides (defaults shown). RELAY_SECRET is set via `wrangler secret`,
# never here.
[vars]
# ALLOWED_ORIGIN = "*"
# MAX_REQUEST_BYTES = "131072"
# MAX_RESPONSE_BYTES = "262144"
# TIMEOUT_MS = "10000"
# ALLOW_PRIVATE = "false"   # keep false; relays can't reach a home LAN anyway

<h1>Fire relay ✓</h1>
<p>This is a self-hosted relay for the
  <a href="https://github.com/zakstone7/even-fire">Fire</a> Even G2 plugin.
  It’s running.</p>
<ul>
  <li>Health check: <a href="/health"><code>/health</code></a> → <code>{"ok":true}</code></li>
  <li>Proxy endpoint: <code>POST /fire</code> (needs your <code>RELAY_SECRET</code>)</li>
</ul>
<p>In the Fire app → Relay, set this site’s URL and the <code>RELAY_SECRET</code>
  you chose during deploy.</p>
